<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" width="560" height="440" role="img" aria-labelledby="enclosure-section-title enclosure-section-desc">
<title id="enclosure-section-title">Circuit board in a two-part housing, shown as a section</title>
<desc id="enclosure-section-desc">Illustration, not to scale: a circuit board in a two-part housing, shown as a section. Not a customer project. The lid is lifted off, and its lip has a groove holding a round seal. The board, with three components, rests on two posts in the base. Dashed lines show where the lid lands. Hatching marks cut material, in a different direction for each part. Labels name the seal, lid, board and base. A dimension line under the base reads: outer size set by the board and the seal.</desc>
