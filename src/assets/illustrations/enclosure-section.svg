<line x1="4.5" y1="0" x2="4.5" y2="9" stroke="#0F1B2D" stroke-width="1.5"/>
</pattern>
<pattern id="enclosure-section-hatch-base" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
<line x1="4.5" y1="0" x2="4.5" y2="9" stroke="#0F1B2D" stroke-width="1.5"/>
</pattern>
