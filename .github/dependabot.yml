version: 2

# Weekly update pull requests for npm packages and for the GitHub Actions used in
# .github/workflows. Nothing is merged automatically. Daniel or an assistant reviews each one.
# Minor and patch updates arrive as one pull request, major updates one by one.
# The cooldown means a release must be 7 days old before Dependabot proposes it, which gives the
# community time to spot a hijacked package. Security fixes ignore the cooldown.

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Copenhagen"
    cooldown:
      default-days: 7
    # At most three open pull requests at a time, so the inbox stays quiet.
    open-pull-requests-limit: 3
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # @types/node has to follow the Node major in .nvmrc (22), not the newest one.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # A new TypeScript major needs Astro, typescript-eslint and the checks to support it first.
      # Someone upgrades it by hand, on purpose.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Copenhagen"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
